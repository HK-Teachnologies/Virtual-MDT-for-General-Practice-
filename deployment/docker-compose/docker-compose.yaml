name: virtual-mdt

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Origin only: lib/api.ts already prefixes every path with /api.
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
    ports:
      - "3000:3000"
    networks:
      - mdt
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # Public domain on the server, plain localhost for local dev.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # Note: a Windows process holds IPv6 :80 on this machine, so the
      # `localhost` name only works where the client falls back to 127.0.0.1.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist the local CA + certs so browsers don't see a new cert on every recreate.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - mdt
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mdt:${POSTGRES_PASSWORD:-changeme}@db:5432/virtualmdt
      REDIS_URL: redis://redis:6379/0
      MODEL_SERVER_URL: http://model-server:8000
    volumes:
      - uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mdt
    restart: unless-stopped

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    # Same image as backend, but running the Celery pipeline instead of uvicorn.
    command: ["celery", "-A", "app.mdt.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mdt:${POSTGRES_PASSWORD:-changeme}@db:5432/virtualmdt
      REDIS_URL: redis://redis:6379/0
      MODEL_SERVER_URL: http://model-server:8000
    volumes:
      - uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      model-server:
        condition: service_started
    networks:
      - mdt
    restart: unless-stopped

  model-server:
    build:
      context: ../../model_server
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
        CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    # First build downloads torch (CPU) + weights and bakes them into the
    # image build takes several minutes once, then starts fast and offline.
    networks:
      - mdt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - mdt
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: virtualmdt
      POSTGRES_USER: mdt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdt -d virtualmdt"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mdt
    restart: unless-stopped

networks:
  mdt:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  uploads:
  redisdata:

